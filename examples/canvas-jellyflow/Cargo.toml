[workspace]
resolver = "2"

[package]
name = "open-gpui-canvas-jellyflow"
version = "0.4.0"
default-run = "open-gpui-canvas-jellyflow"
edition = "2024"
rust-version = "1.95"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/jellyflow"
homepage = "https://github.com/Latias94/jellyflow"
readme = "README.md"
publish = false
description = "Retained native Open GPUI workflow and shader graphs built on Jellyflow's headless runtime."

[features]
default = []
real-window-smoke = []

[[bin]]
name = "open-gpui-canvas-jellyflow"
path = "src/main.rs"

[[bin]]
name = "open-gpui-real-window-smoke"
path = "src/open_gpui_real_window_smoke.rs"
required-features = ["real-window-smoke"]

[dependencies]
futures-util = "0.3"
jellyflow-core = { path = "../../crates/jellyflow-core" }
jellyflow-open-gpui = { path = "../../crates/jellyflow-open-gpui" }
jellyflow-runtime = { path = "../../crates/jellyflow-runtime" }
open_gpui = { package = "open-gpui", git = "https://github.com/Latias94/open-gpui", rev = "f75c10b2a9bf7b4dcb2c8c2aa446203997601369", default-features = false }
open_gpui_platform = { package = "open-gpui-platform", git = "https://github.com/Latias94/open-gpui", rev = "f75c10b2a9bf7b4dcb2c8c2aa446203997601369", default-features = false, features = ["font-kit"] }
open_gpui_ui_components = { package = "open-gpui-ui-components", git = "https://github.com/Latias94/open-gpui", rev = "f75c10b2a9bf7b4dcb2c8c2aa446203997601369" }
serde_json = "1"
thiserror = "2"
uuid = "1"

[dev-dependencies]
open_gpui = { package = "open-gpui", git = "https://github.com/Latias94/open-gpui", rev = "f75c10b2a9bf7b4dcb2c8c2aa446203997601369", default-features = false, features = ["test-support"] }
open_gpui_platform = { package = "open-gpui-platform", git = "https://github.com/Latias94/open-gpui", rev = "f75c10b2a9bf7b4dcb2c8c2aa446203997601369", default-features = false, features = ["font-kit", "test-support"] }
