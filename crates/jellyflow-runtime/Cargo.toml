[package]
name = "jellyflow-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/jellyflow-runtime"
readme = "README.md"
description = "Renderer-neutral graph runtime and native view protocol for Jellyflow."
keywords = ["graph", "node-graph", "flow", "headless"]
categories = ["data-structures", "gui"]

[dependencies]
jellyflow-core.workspace = true
jellyflow-layout.workspace = true
rpds.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
xattr.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints.clippy]
arc_with_non_send_sync = "allow"
default_constructed_unit_structs = "allow"
doc_lazy_continuation = "allow"
field_reassign_with_default = "allow"
map_entry = "allow"
new_without_default = "allow"
ok_expect = "allow"
question_mark = "allow"
redundant_closure = "allow"
reserve_after_initialization = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
