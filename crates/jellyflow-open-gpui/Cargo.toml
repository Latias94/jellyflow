[package]
name = "jellyflow-open-gpui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/jellyflow-open-gpui"
readme = "README.md"
description = "Retained native Open GPUI adapter for Jellyflow node graphs."
keywords = ["gpui", "graph", "node-graph", "adapter"]
categories = ["gui", "visualization"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[dependencies]
jellyflow-core.workspace = true
jellyflow-runtime.workspace = true
lyon.workspace = true
futures-util.workspace = true
open_gpui.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc = "0.2.7"
raw-window-handle = "0.6.2"

[dev-dependencies]
open_gpui = { workspace = true, features = ["test-support"] }
open_gpui_ui_components.workspace = true
serde_json.workspace = true

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
