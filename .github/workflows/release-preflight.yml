name: Release Preflight

on:
  workflow_call:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string
      source_sha:
        description: "Exact Git commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  versions-and-packages:
    name: versions-and-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: clippy,rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false

      - name: Verify release versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release-version.py check --version "$RELEASE_VERSION"

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --locked

      - name: Test
        run: cargo nextest run --workspace --locked --cargo-quiet

      - name: Workspace doctests
        run: cargo test --workspace --doc --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Benchmark smoke
        run: cargo bench -p jellyflow-layout --features benchmark-internals --bench layout_engines --locked -- --test

      - name: Dependency boundary smoke
        run: python3 tools/check_no_fret_dependencies.py

      - name: Dependency boundary unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_*.py"

      - name: Package archive boundary consumers
        run: python3 tools/check_external_consumer_smoke.py

      - name: Package file lists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/package-lists
          mapfile -t crates < scripts/release-crates.txt
          if [ "${#crates[@]}" -eq 0 ]; then
            echo "::error::The ordered release crate set is empty."
            exit 1
          fi
          for crate in "${crates[@]}"; do
            cargo package --locked --list -p "$crate" > "target/package-lists/$crate.txt"
          done

      - name: Upload package lists
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: crate-package-lists
          path: target/package-lists/*.txt

  open-gpui-product:
    name: open-gpui-product
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: clippy,rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false

      - name: Archived Open GPUI package consumer
        run: >-
          python3 tools/check_external_consumer_smoke.py
          --packages-only
          --package-consumer open-gpui

      - name: Check
        run: cargo check --manifest-path examples/canvas-jellyflow/Cargo.toml --workspace --locked

      - name: Format
        run: cargo fmt --manifest-path examples/canvas-jellyflow/Cargo.toml --all -- --check

      - name: Test
        run: cargo nextest run --manifest-path examples/canvas-jellyflow/Cargo.toml -p open-gpui-canvas-jellyflow --locked --no-fail-fast --status-level fail --final-status-level fail

      - name: Doctests
        run: cargo test --manifest-path examples/canvas-jellyflow/Cargo.toml --workspace --doc --locked

      - name: Clippy
        run: cargo clippy --manifest-path examples/canvas-jellyflow/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Build real-window smoke binary
        run: cargo build --manifest-path examples/canvas-jellyflow/Cargo.toml -p open-gpui-canvas-jellyflow --locked --features real-window-smoke

      - name: Open GPUI real-window smoke matrix
        id: real_window_smoke_matrix
        if: always()
        timeout-minutes: 10
        run: |
          python3 tools/run_real_window_smoke_matrix.py \
            --binary examples/canvas-jellyflow/target/debug/open-gpui-canvas-jellyflow \
            --capture-root target/real-window-smoke \
            --timeout-seconds 60 \
            --capture-dir-output "$GITHUB_OUTPUT"

      - name: Validate and manifest Open GPUI real-window evidence
        if: always()
        env:
          JELLYFLOW_SMOKE_CAPTURE_DIR: ${{ steps.real_window_smoke_matrix.outputs.capture_dir }}
        run: |
          python3 tools/check_real_window_smoke_evidence.py \
            --capture-dir "$JELLYFLOW_SMOKE_CAPTURE_DIR"

      - name: Upload Open GPUI real-window evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: open-gpui-real-window-smoke
          path: |
            ${{ steps.real_window_smoke_matrix.outputs.capture_dir }}/*.png
            ${{ steps.real_window_smoke_matrix.outputs.capture_dir }}/results.json
            ${{ steps.real_window_smoke_matrix.outputs.capture_dir }}/manifest.txt
          if-no-files-found: error
