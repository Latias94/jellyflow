name: Release Preflight

on:
  workflow_call:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string
      source_sha:
        description: "Exact Git commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  release-candidates:
    name: release-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false

      - name: Verify release versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release-version.py check --version "$RELEASE_VERSION"

      - name: Package archive boundary consumers
        run: python3 tools/check_external_consumer_smoke.py
