name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            release_gates: true
          - os: macos-15
            release_gates: false
          - os: windows-2025-vs2026
            release_gates: false

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: clippy,rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false

      - name: Format
        if: matrix.release_gates
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --workspace --locked

      - name: Test
        run: cargo nextest run --workspace --locked --cargo-quiet

      - name: Workspace doctests
        run: cargo test --workspace --doc --locked

      - name: Clippy
        if: matrix.release_gates
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Benchmark smoke
        if: matrix.release_gates
        run: cargo bench -p jellyflow-layout --features benchmark-internals --bench layout_engines --locked -- --test

      - name: Dependency boundary smoke
        if: matrix.release_gates
        run: python3 tools/check_no_fret_dependencies.py

      - name: Dependency boundary unit tests
        if: matrix.release_gates
        run: python3 -m unittest discover -s tools/tests -p "test_*.py"

      - name: Package-derived external consumer smoke
        if: matrix.release_gates
        run: python3 tools/check_external_consumer_smoke.py

      - name: Open GPUI product workspace check
        if: runner.os == 'macOS'
        run: cargo check --manifest-path examples/canvas-jellyflow/Cargo.toml --workspace --locked

      - name: Open GPUI product workspace format
        if: runner.os == 'macOS'
        run: cargo fmt --manifest-path examples/canvas-jellyflow/Cargo.toml --all -- --check

      - name: Open GPUI product workspace test
        if: runner.os == 'macOS'
        run: cargo nextest run --manifest-path examples/canvas-jellyflow/Cargo.toml -p open-gpui-canvas-jellyflow --locked --no-fail-fast --status-level fail --final-status-level fail

      - name: Open GPUI product workspace doctests
        if: runner.os == 'macOS'
        run: cargo test --manifest-path examples/canvas-jellyflow/Cargo.toml --workspace --doc --locked

      - name: Open GPUI product workspace clippy
        if: runner.os == 'macOS'
        run: cargo clippy --manifest-path examples/canvas-jellyflow/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Build Open GPUI real-window smoke binary
        if: runner.os == 'macOS'
        run: cargo build --manifest-path examples/canvas-jellyflow/Cargo.toml -p open-gpui-canvas-jellyflow --locked --features real-window-smoke

      - name: Open GPUI real-window smoke matrix
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          JELLYFLOW_SMOKE_CAPTURE_DIR: target/real-window-smoke
        run: |
          set -euo pipefail
          for zoom in 0.5 1 2; do
            JELLYFLOW_SMOKE_ZOOM="$zoom" python3 tools/run_with_timeout.py --timeout-seconds 60 -- examples/canvas-jellyflow/target/debug/open-gpui-canvas-jellyflow --smoke
            JELLYFLOW_SMOKE_ZOOM="$zoom" python3 tools/run_with_timeout.py --timeout-seconds 60 -- examples/canvas-jellyflow/target/debug/open-gpui-canvas-jellyflow --workflow --smoke
          done

      - name: Upload Open GPUI real-window evidence
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: open-gpui-real-window-smoke
          path: target/real-window-smoke/*.png
          if-no-files-found: error

      - name: Package file lists
        if: matrix.release_gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/package-lists
          mapfile -t crates < scripts/release-crates.txt
          if [ "${#crates[@]}" -eq 0 ]; then
            echo "::error::The ordered release crate set is empty."
            exit 1
          fi
          for crate in "${crates[@]}"; do
            cargo package --locked --list -p "$crate" > "target/package-lists/$crate.txt"
          done

      - name: Upload package lists
        if: matrix.release_gates
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: crate-package-lists
          path: target/package-lists/*.txt

      - name: Diff whitespace check
        if: matrix.release_gates
        run: git diff --check
