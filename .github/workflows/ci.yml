name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            release_gates: true
          - os: macos-15
            release_gates: false
          - os: windows-2025-vs2026
            release_gates: false

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@f133eefe930d61f0d9371efd474daf0125ed3dd1 # 1.95.0
        with:
          components: clippy,rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false

      - name: Format
        if: matrix.release_gates
        run: cargo fmt --all --check

      - name: Test
        run: cargo nextest run --workspace --locked --cargo-quiet

      - name: Workspace doctests
        if: matrix.release_gates
        run: cargo test --workspace --doc --locked

      - name: Clippy
        if: matrix.release_gates
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Dependency boundary smoke
        if: matrix.release_gates
        run: python3 tools/check_no_fret_dependencies.py

      - name: Release tooling tests
        if: matrix.release_gates
        run: python3 -m unittest discover -s tools/tests -p "test_*.py"

      - name: Package archive boundary consumers
        if: matrix.release_gates && github.event_name == 'push'
        run: python3 tools/check_external_consumer_smoke.py

      - name: Open GPUI product workspace format
        if: runner.os == 'macOS'
        run: cargo fmt --manifest-path examples/canvas-jellyflow/Cargo.toml --all -- --check

      - name: Open GPUI product workspace test
        if: runner.os == 'macOS'
        run: cargo nextest run --manifest-path examples/canvas-jellyflow/Cargo.toml --workspace --all-features --locked --no-fail-fast --status-level fail --final-status-level fail

      - name: Open GPUI product workspace doctests
        if: runner.os == 'macOS'
        run: cargo test --manifest-path examples/canvas-jellyflow/Cargo.toml --workspace --all-features --doc --locked

      - name: Open GPUI product workspace clippy
        if: runner.os == 'macOS'
        run: cargo clippy --manifest-path examples/canvas-jellyflow/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build Open GPUI real-window smoke binary
        if: runner.os == 'macOS'
        run: cargo build --manifest-path examples/canvas-jellyflow/Cargo.toml -p open-gpui-canvas-jellyflow --bin open-gpui-real-window-smoke --locked --features real-window-smoke

      - name: Open GPUI real-window smoke
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          examples/canvas-jellyflow/target/debug/open-gpui-real-window-smoke
          examples/canvas-jellyflow/target/debug/open-gpui-real-window-smoke --workflow

      - name: Diff whitespace check
        if: matrix.release_gates
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA..$HEAD_SHA"
          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --check "$empty_tree" "$HEAD_SHA"
          fi
